<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Build Journal · iPhone slider test</title><style>
*{box-sizing:border-box}body{margin:0;background:#142027;color:#f0e8df;font:16px system-ui;padding:22px;max-width:720px;margin-inline:auto}h1{font-family:Georgia,serif;color:#d59a70;font-size:28px}.compare{position:relative;overflow:hidden;aspect-ratio:1.15;border:1px solid #67757a;touch-action:none;user-select:none;-webkit-user-select:none;cursor:ew-resize;background:#304b58}.panel{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(25px,7vw,48px);font-weight:700;letter-spacing:.06em}.after{background:linear-gradient(140deg,#244e60,#102833);color:#fff}.before{background:linear-gradient(140deg,#bd754b,#713f2d);color:#fff;clip-path:inset(0 50% 0 0)}.line{position:absolute;left:50%;top:0;bottom:0;width:2px;background:white;pointer-events:none}.handle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:50%;width:52px;height:52px;background:#f5eee6;color:#19252b;display:grid;place-items:center;font-size:23px;box-shadow:0 3px 14px #0006}#status{font-weight:700;color:#e6af84}p{line-height:1.5}button{background:#e4c2a6;color:#17232a;border:0;border-radius:5px;padding:12px 20px;font-size:16px}.compare:focus-visible{outline:3px solid #e6af84}
</style></head><body><h1>Build Journal · Slider Test</h1><p>This is a temporary interaction test, not the Bar Cabinet page. Drag the white circle horizontally or tap anywhere in the image.</p><div id="compare" class="compare" role="slider" tabindex="0" aria-label="Before and after comparison" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><div class="panel after">AFTER</div><div id="before" class="panel before">BEFORE</div><div id="line" class="line"><div class="handle">‹ ›</div></div></div><p>Position: <span id="status">50%</span></p><button id="reset">Reset to center</button><p id="event">Waiting for interaction…</p><script>
(()=>{const c=document.getElementById('compare'),b=document.getElementById('before'),l=document.getElementById('line'),s=document.getElementById('status'),e=document.getElementById('event');let v=50;function set(n){v=Math.max(0,Math.min(100,n));b.style.clipPath='inset(0 '+(100-v)+'% 0 0)';l.style.left=v+'%';s.textContent=Math.round(v)+'%';c.setAttribute('aria-valuenow',Math.round(v));}function move(x){const r=c.getBoundingClientRect();set((x-r.left)/r.width*100)}c.addEventListener('pointerdown',ev=>{c.setPointerCapture(ev.pointerId);move(ev.clientX);e.textContent='Pointer down: '+ev.pointerType});c.addEventListener('pointermove',ev=>{if(c.hasPointerCapture(ev.pointerId)){move(ev.clientX);e.textContent='Dragging: '+ev.pointerType}});c.addEventListener('pointerup',ev=>{move(ev.clientX);e.textContent='Pointer released'});c.addEventListener('pointercancel',()=>e.textContent='Pointer canceled');c.addEventListener('keydown',ev=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(ev.key)){ev.preventDefault();set(ev.key==='Home'?0:ev.key==='End'?100:v+(ev.key==='ArrowLeft'?-5:5));}});document.getElementById('reset').addEventListener('click',()=>{set(50);e.textContent='Reset button worked — JavaScript is running';});})();
</script></body></html>
